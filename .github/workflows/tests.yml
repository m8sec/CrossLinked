# Offline test suite: every test uses mocks or a loopback HTTP fixture.
# Outbound HTTP(S) is routed to a closed local port so an accidental network
# call fails fast instead of depending on a search engine.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13', '3.14']
    env:
      HTTP_PROXY: http://127.0.0.1:9
      HTTPS_PROXY: http://127.0.0.1:9
      NO_PROXY: 127.0.0.1,localhost
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q crosslinked tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (parse mode, no network)
        run: |
          printf 'Name,Title,URL,rawText\n' > smoke.csv
          printf 'Jane Example,Lecturer at Example University,https://www.linkedin.com/in/jane,Jane Example - Lecturer at Example University\n' >> smoke.csv
          python crosslinked.py smoke.csv --organization 'Example University' -f '{first}.{last}' -o smoke
          test "$(cat smoke.txt)" = "jane.example"
          python -c "import json; d=json.load(open('smoke.run.json')); assert d['status']=='complete' and d['selected']==1, d"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt mypy types-requests
      - name: mypy
        run: python -m mypy
