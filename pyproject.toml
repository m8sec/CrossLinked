[tool.poetry]
name = "crosslinked"
version = "0.3.0"
license = "GPL-3.0"
authors = ["a7t0fwa7"]
maintainers = ["a7t0fwa7"]
description = "Linkedin enumeration through search engine scraping"
repository = "https://github.com/a7t0fwa7/CrossLinked"
homepage = "https://github.com/a7t0fwa7/CrossLinked"
packages = [
    { include = "crosslinked"}
]

[tool.poetry.scripts]
crosslinked = 'crosslinked:main'

[tool.poetry.dependencies]
python = "^3.8"
beautifulsoup4 = "^4.12.2"
bs4 = "^0.0.1"
certifi = "^2023.7.22"
charset-normalizer = "^3.2.0"
idna = "^3.7"
lxml = "^4.9.3"
requests = "^2.31.0"
soupsieve = "^2.5"
Unidecode = "^1.3.7"
urllib3 = "^2.0.7"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
files = ["crosslinked"]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
